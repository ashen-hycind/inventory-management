services:
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-1
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_NAME=backend-instance-1
      - NODE_ENV=production
    ports:
      - "5001:5000"
    networks:
      - shop-network

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-2
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_NAME=backend-instance-2
      - NODE_ENV=production
    ports:
      - "5002:5000"
    networks:
      - shop-network

  backend-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-3
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_NAME=backend-instance-3
      - NODE_ENV=production
    ports:
      - "5003:5000"
    networks:
      - shop-network

  nginx:
    image: nginx:alpine
    container_name: nginx-load-balancer
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - shop-network

networks:
  shop-network:
    driver: bridge
