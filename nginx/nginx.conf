events {
    worker_connections 1024;
}

http {
    # Upstream cluster with 3 backend instances (Round-Robin with passive health checks)
    upstream backend_cluster {
        server backend-1:5000 max_fails=1 fail_timeout=10s;
        server backend-2:5000 max_fails=1 fail_timeout=10s;
        server backend-3:5000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend_cluster;

            # High Availability & Fault Tolerance Configuration (Question 1c)
            # When an instance crashes/stops, immediately retry next upstream with zero dropped requests
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;

            # Headers forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Response verification headers
            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
            add_header X-Load-Balancer "Nginx-Campus-Shop" always;
        }

        # Health check endpoint for the load balancer itself
        location /lb-health {
            return 200 '{"status":"UP","load_balancer":"Nginx","cluster":["backend-1","backend-2","backend-3"]}\n';
            add_header Content-Type application/json;
        }
    }
}
